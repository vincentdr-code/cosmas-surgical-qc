server {
    server_name cosmas-sentry.duckdns.org;

    root /home/ubuntu/cosmas-react/dist;
    index index.html;

    # React SPA — all non-api, non-laravel routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laravel storage — serve uploaded/generated files directly from disk
    location /storage/ {
        alias /home/ubuntu/cosmas/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Laravel auth + app endpoints (no /laravel/ prefix in generated URLs)
    location ~ ^/(login|logout|register|forgot-password|reset-password|verify-email|dashboard|profile|inspect|inspections|audit-log|results|settings)(/.*)?$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /home/ubuntu/cosmas/public/index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param SERVER_NAME cosmas-sentry.duckdns.org;
    }

    # Laravel API
    location /api/ {
        try_files $uri $uri/ @laravel_api;
    }
    location @laravel_api {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /home/ubuntu/cosmas/public/index.php;
        include fastcgi_params;
        fastcgi_param SERVER_NAME cosmas-sentry.duckdns.org;
    }

    # Laravel web app — strip /laravel prefix so Laravel routes match
    location /laravel/ {
        # Rewrite /laravel/foo → /foo (break = stay in this block, updates $uri)
        rewrite ^/laravel/?(.*)$ /$1 break;
        root /home/ubuntu/cosmas/public;
        try_files $uri $uri/ @laravel_web;
    }
    location @laravel_web {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /home/ubuntu/cosmas/public/index.php;
        include fastcgi_params;
        # Pass the rewritten URI (e.g. /dashboard) not the original /laravel/dashboard
        fastcgi_param REQUEST_URI $uri;
        fastcgi_param SERVER_NAME cosmas-sentry.duckdns.org;
    }

    
    # Laravel Vite build assets — must use ^~ to beat .css/.js regex
    location ^~ /build/ {
        root /home/ubuntu/cosmas/public;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.ht {
        deny all;
    }

    client_max_body_size 20M;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cosmas-sentry.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cosmas-sentry.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = cosmas-sentry.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name cosmas-sentry.duckdns.org;
    return 404; # managed by Certbot
}
